apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-configmap
  namespace: registry
data:
  CONFIG_SERVER_PORT: "8888"
  REGISTRY_SERVICE_PORT: "8761"
  CONFIG_SERVER_HOSTNAME: "config-service.config.svc.cluster.local"
  SSL_ENABLED: "false"
  SSL_KEYSTORE: "/certs/keystore.p12"
  SSL_KEY_ALIAS: "tomcat"
  PROFILE: "dev"


