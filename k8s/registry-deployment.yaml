apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-deployment
  namespace: registry
  labels:
    app: registry
    tier: backend
    environment: dev
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 10
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  template:
    metadata:
      name: registry-pod
      labels:
        app: registry
        tier: backend
        environment: dev
        version: "1.0.0"
    spec:
      containers:
        - name: eureka-registry
          image: registry:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: registry-configmap
            - secretRef:
                name: registry-secret
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
              ephemeral-storage: "2Gi"
            limits:
              cpu: "2"
              memory: "1Gi"
              ephemeral-storage: "2Gi"

          ports:
            - name: http
              containerPort: 8761
              protocol: TCP
          startupProbe:
            httpGet:
              port: http
              path: "/actuator/health/liveness"
              scheme: HTTP
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              port: http
              scheme: HTTP
              path: "/actuator/health/liveness"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              port: http
              scheme: HTTP
              path: "/actuator/health/readiness"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30


---
apiVersion: v1
kind: Service
metadata:
  name: registry-service
  namespace: registry
spec:
  selector:
    app: registry
  ports:
    - protocol: TCP
      port: 8761
      targetPort: 8761
  type: ClusterIP
