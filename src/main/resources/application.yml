spring:
  application:
    name: Service Registry
  config:
    import: 'optional:configserver:http://${CONFIG_SERVER_HOSTNAME}:${CONFIG_SERVER_PORT}/config'
  profiles:
    active: ${PROFILE}
  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
      label: main
      profile: ${PROFILE}
      name: registry
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 2
        max-interval: 2000
        multiplier: 1.1
        use-random-policy: true
      send-all-labels: true
      multiple-uri-strategy: always
      request-connect-timeout: 5000
      request-read-timeout: 5000
      charset: UTF-8



